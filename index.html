<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>がくりょくしんだん</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a4d80" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="がくりょくしんだん" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
<div id="app">

  <!-- ============ ホーム画面 ============ -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <h1>がくりょく しんだん</h1>
      <p class="muted small">算数・社会の 単元べつ かんいテスト</p>
    </header>

    <div class="panel">
      <h2>🔢 算数</h2>
      <div id="home-history-sansu"></div>
      <button id="btn-start-sansu" class="big-btn primary">▶ 算数をはじめる</button>
    </div>

    <div class="panel">
      <h2>🗾 社会</h2>
      <div id="home-history-shakai"></div>
      <button id="btn-start-shakai" class="big-btn">▶ 社会をはじめる</button>
    </div>

    <button id="btn-open-history" class="text-btn">📄 まえの結果を みる</button>

    <p class="muted small note">※ これは「クイズ」だよ。わからなくても だいじょうぶ、今の力を知るためのものだよ。</p>
    <p id="app-version" class="muted small version-label"></p>
  </section>

  <!-- ============ 履歴画面（過去の受験結果を再表示） ============ -->
  <section id="screen-history" class="screen hidden">
    <header class="app-header">
      <h1>まえの結果</h1>
      <p class="muted small">見たい回をえらんでね</p>
    </header>

    <div class="panel">
      <div id="history-list"></div>
    </div>

    <button id="btn-history-home" class="big-btn primary">ホームへ もどる</button>
  </section>

  <!-- ============ 範囲えらび画面（未習単元を出題から外す） ============ -->
  <section id="screen-scope" class="screen hidden">
    <header class="app-header">
      <h1>ならったところを えらぼう</h1>
      <p class="muted small"><span id="scope-subject-label"></span>で <strong>まだならっていない</strong>ものは チェックを外してね</p>
    </header>

    <div class="panel">
      <div class="scope-tools">
        <button id="btn-scope-all" class="text-btn small">ぜんぶ えらぶ</button>
        <button id="btn-scope-none" class="text-btn small">ぜんぶ 外す</button>
      </div>
      <div id="scope-list"></div>
    </div>

    <button id="btn-scope-start" class="big-btn primary">▶ このはんいで はじめる</button>
    <button id="btn-scope-back" class="text-btn">もどる</button>
  </section>

  <!-- ============ クイズ画面 ============ -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <button id="btn-quiz-quit" class="text-btn small">やめる</button>
      <div class="quiz-top-right">
        <span id="quiz-subject-label" class="subject-badge"></span>
        <div id="quiz-progress" class="progress-badge">1 / 10</div>
      </div>
    </div>

    <div class="question-area">
      <p id="quiz-unit-label" class="unit-cue"></p>
      <p id="quiz-question" class="prompt"></p>
    </div>

    <div id="quiz-choices" class="vocab-choices"></div>

    <div id="quiz-feedback" class="reveal hidden">
      <p id="quiz-feedback-msg" class="self-check-label"></p>
      <p id="quiz-explanation" class="muted small"></p>
      <button id="btn-quiz-next" class="big-btn primary">つぎへ</button>
    </div>
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="screen-result" class="screen hidden">
    <header class="app-header">
      <h1>おつかれさま！</h1>
      <p id="result-subject-label" class="muted"></p>
    </header>
    <div class="result-score-box">
      <div id="result-score" class="result-score">0 / 0</div>
      <p id="result-msg" class="result-msg"></p>
    </div>

    <div class="panel">
      <h2>単元別 苦手マップ</h2>
      <p id="result-scope-note" class="muted small"></p>
      <div id="result-unit-map"></div>
    </div>

    <div class="panel" id="result-wrongs-panel">
      <div id="result-wrongs"></div>
    </div>

    <div class="panel" id="result-compare-panel">
      <div id="result-compare"></div>
    </div>

    <!-- 保護者向け: 結果をテキストで書き出して記録・共有する -->
    <div class="panel">
      <h2>おうちの人へ</h2>
      <button id="btn-share-result" class="big-btn primary">📤 結果を ファイルで わたす</button>
      <p class="muted small">AirDropでMacへ送る／ファイルAppに保存（全履歴・バックアップ兼用）</p>
      <button id="btn-copy-result" class="big-btn">📋 この回だけ コピー</button>
      <p id="copy-status" class="muted small hidden"></p>
      <textarea id="copy-fallback" class="copy-fallback hidden" readonly rows="10"></textarea>
    </div>

    <button id="btn-result-home" class="big-btn primary">ホームへ もどる</button>
  </section>

</div>

<script src="sansu_data.js"></script>
<script src="shakai_data.js"></script>
<script src="app.js"></script>
</body>
</html>
